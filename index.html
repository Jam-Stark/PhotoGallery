<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Baoquan's Gallery</title>
  <style>
    /* === 基础样式 === */
    :root {
      --bg: #000000;
      --bg-translucent: rgba(20, 20, 20, 0.85);
      --fg: #f5f5f7;
      --card-bg: #1c1c1e;
      --accent: #0a84ff;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --bg-translucent: rgba(255,255,255,0.85); --fg: #1d1d1f; --card-bg: #f2f2f7; --accent: #0071e3; }
    }

    body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--fg); overflow-y: scroll; }
    .container { max-width: 1600px; margin: 0 auto; padding: 0 20px; }

    /* === 导航 === */
    header.nav { position: sticky; top: 0; z-index: 100; background: var(--bg-translucent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(125,125,125,0.15); }
    .nav-inner { height: 60px; display: flex; align-items: center; }
    .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }

    /* === 筛选器 === */
    .controls-area { position: sticky; top: 61px; z-index: 90; padding: 16px 0; background: var(--bg); transition: transform 0.3s; }
    .controls-inner { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .chip { padding: 8px 18px; border-radius: 20px; font-size: 14px; background: var(--card-bg); color: #888; transition: 0.2s; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .chip:hover { background: color-mix(in srgb, var(--card-bg), #fff 10%); }
    .chip.active { background: var(--fg); color: var(--bg); }
    .search-input { margin-left: auto; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 12px; color: var(--fg); outline: none; width: 140px; transition: width 0.3s; }
    .search-input:focus { width: 200px; border-color: var(--accent); }

    /* === 核心布局 === */
    .grid { display: flex; align-items: flex-start; gap: 20px; padding-bottom: 100px; }
    .grid-col { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    /* 卡片样式 */
    .card {
      position: relative; border-radius: 12px; overflow: hidden; background: var(--card-bg);
      transform: translateY(20px); opacity: 0; transition: transform 0.5s ease, opacity 0.5s ease;
      cursor: zoom-in;
    }
    .card.reveal { transform: translateY(0); opacity: 1; }
    
    /* 图片样式修复 */
    .thumb { 
      display: block; width: 100%; height: auto; object-fit: cover; 
      background: var(--card-bg); /* 加载前背景色 */
      min-height: 100px; /* 防止高度塌陷 */
      transition: opacity 0.3s; /* 图片加载时的淡入效果 */
    }
    .card.image-failed::before {
      content: "正在重试加载...";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 13px;
      pointer-events: none;
    }
    
    /* 渐变信息层 */
    .meta { 
      position: absolute; bottom: 0; left: 0; right: 0; 
      padding: 40px 12px 12px; 
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); 
      color: #fff; font-size: 12px; font-weight: 500;
      opacity: 0; transition: 0.3s; pointer-events: none; 
    }
    .card:hover .meta { opacity: 1; }

    /* Lightbox */
    .lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s; }
    .lightbox.open { display: flex; opacity: 1; }
    .lb-img { max-width: 96vw; max-height: 94vh; border-radius: 4px; box-shadow: 0 20px 80px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s; }
    .lightbox.open .lb-img { transform: scale(1); }
    
    .loading { text-align: center; padding: 40px; color: #888; display: none; font-size: 14px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: var(--fg); animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <header class="nav">
    <div class="nav-inner container">
      <div class="brand"><div class="brand-dot"></div><span>Gallery</span></div>
    </div>
  </header>

  <div class="container">
    <div class="controls-area">
      <div class="controls-inner">
        <div id="albums" style="display:flex; gap:10px"></div>
        <input id="searchInput" class="search-input" type="text" placeholder="Search...">
      </div>
    </div>

    <div id="grid" class="grid"></div>
    
    <div id="msg" class="loading">
      <span class="spinner"></span><span>Loading...</span>
    </div>
  </div>

  <div id="lightbox" class="lightbox">
    <img id="lbImg" class="lb-img">
  </div>

  <script>
  (function(){
    // === CONFIG ===
    const CONFIG = {
      DATA_URL: "./gallery-data.json",
    };

    let state = {
      albums: [],
      currentAlbum: null,
      loading: false,
      columns: [], 
      colCount: 0,
      rootFolderId: null,
      allPhotos: [],
      photosByAlbum: {},
    };

    const $ = id => document.getElementById(id);

    const IMAGE_LOAD_TIMEOUT_MS = 30000;
    const IMAGE_RETRY_DELAY_MS = 3000;

    // === 核心：懒加载观察者 ===
    // 只有当图片即将进入视口（margin: 800px）时，才触发下载
    const imgObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        const img = entry.target;
        img._isNearViewport = entry.isIntersecting;

        if (entry.isIntersecting) {
          ensureImageLoad(img);
        } else if (img._loadState === 'loaded') {
          observer.unobserve(img);
        }
      });
    }, { rootMargin: "800px" }); // 提前开始加载，快速滚动时也尽量跟上

    function driveThumbnailUrl(id, width) {
      return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${width}`;
    }

    function driveViewUrl(id) {
      return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`;
    }

    function sizedThumbnailLink(link, width) {
      return link.replace(/=s\d+(\-c)?/, `=s${width}`);
    }

    function imageSources(meta, width) {
      const sources = [
        meta.assetPath,
        meta.thumbnailPath,
        meta.thumbnailLink ? sizedThumbnailLink(meta.thumbnailLink, width) : '',
        meta.id ? driveThumbnailUrl(meta.id, width) : '',
        meta.id ? driveViewUrl(meta.id) : '',
      ].filter(Boolean);

      return Array.from(new Set(sources));
    }

    function isNearViewport(el) {
      const rect = el.getBoundingClientRect();
      const margin = window.innerHeight * 2;
      return rect.bottom >= -margin && rect.top <= window.innerHeight + margin;
    }

    function scheduleImageRetry(img) {
      clearTimeout(img._retryTimer);
      if (!img.isConnected || img._loadState === 'loaded') return;

      img._retryTimer = setTimeout(() => {
        if (!img.isConnected || img._loadState === 'loaded') return;
        if (img._isNearViewport || isNearViewport(img)) ensureImageLoad(img, true);
      }, IMAGE_RETRY_DELAY_MS);
    }

    function ensureImageLoad(img, force = false) {
      if (img._loadState === 'loaded') return;
      if (img._loadState === 'loading' && !force) return;

      clearTimeout(img._retryTimer);
      img.closest('.card')?.classList.remove('image-failed');
      loadImageWithFallback(img, img._sources || [], () => {
        img.closest('.card')?.classList.add('image-failed');
        scheduleImageRetry(img);
      });
    }

    function loadImageWithFallback(img, sources, onFail) {
      let index = 0;
      let timer = null;
      const attemptId = (img._attemptId || 0) + 1;
      img._attemptId = attemptId;
      img._loadState = 'loading';

      img.onload = () => {
        if (img._attemptId !== attemptId) return;
        clearTimeout(timer);
        img._loadState = 'loaded';
        img.closest('.card')?.classList.remove('image-failed');
        img.style.opacity = 1;
        imgObserver.unobserve(img);
      };

      img.onerror = () => {
        if (img._attemptId !== attemptId) return;
        clearTimeout(timer);
        loadNext();
      };

      function loadNext() {
        if (img._attemptId !== attemptId) return;
        clearTimeout(timer);
        if (index >= sources.length) {
          img.removeAttribute('src');
          img.style.opacity = 0;
          img._loadState = 'failed';
          if (onFail) onFail();
          return;
        }

        img.src = sources[index];
        index += 1;
        timer = setTimeout(loadNext, IMAGE_LOAD_TIMEOUT_MS);
      }

      loadNext();
    }

    // === 核心逻辑：创建列 ===
    function setupGrid() {
      const grid = $('grid');
      const w = window.innerWidth;
      
      // 响应式列数
      let newColCount = 1;
      if (w >= 600) newColCount = 2;
      if (w >= 900) newColCount = 3;
      if (w >= 1400) newColCount = 4;
      if (w >= 1800) newColCount = 5;

      if (newColCount === state.colCount && grid.children.length > 0) return;

      state.colCount = newColCount;
      state.columns = [];
      grid.innerHTML = '';

      for (let i = 0; i < newColCount; i++) {
        const col = document.createElement('div');
        col.className = 'grid-col';
        grid.appendChild(col);
        state.columns.push(col);
      }
    }

    async function init() {
      setupGrid();
      window.addEventListener('resize', () => {
         // 可选：resize 时刷新布局（此处略过以保持简单）
         setupGrid();
      });

      try {
        const res = await fetch(CONFIG.DATA_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('Data fetch failed');
        const data = await res.json();
        state.albums = data.albums || [];
        state.rootFolderId = data.rootFolderId || null;
        state.allPhotos = data.allPhotos || [];
        state.photosByAlbum = data.photosByAlbum || {};
        renderTabs();
        selectAlbum('__all__');
      } catch(e) { 
        $('msg').innerHTML = "无法加载照片数据，请稍后刷新重试";
        $('msg').style.display = 'block';
      }
    }

    function renderTabs() {
      const box = $('albums');
      box.innerHTML = '';
      const mk = (id, txt) => {
        const b = document.createElement('div');
        b.className = 'chip';
        b.textContent = txt;
        b.onclick = () => selectAlbum(id);
        b.dataset.id = id;
        box.appendChild(b);
      };
      mk('__all__', '全部');
      state.albums.forEach(a => mk(a.id, a.name));
    }

    async function selectAlbum(id) {
      if (state.loading) return;
      state.loading = true;
      state.currentAlbum = id;
      
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));
      
      // 重置布局
      setupGrid(); 
      state.columns.forEach(c => c.innerHTML = ''); 
      
      $('msg').style.display = 'block';

      try {
        let files = [];
        if (id === '__all__') files = state.allPhotos;
        else files = state.photosByAlbum[id] || [];

        files.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime));
        renderPhotos(files);

      } catch(e) { console.error(e); }
      finally { 
        state.loading = false; 
        $('msg').style.display = 'none'; 
      }
    }

    // === 渲染核心 ===
    function renderPhotos(files) {
      if(!files.length) { 
        $('msg').innerHTML = '暂无照片'; 
        $('msg').style.display='block'; 
        return; 
      }
      
      files.forEach((meta, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // 宽高比占位
        const w = Number(meta.imageMediaMetadata?.width) || 1;
        const h = Number(meta.imageMediaMetadata?.height) || 1;
        
        const date = meta.createdTime ? new Date(meta.createdTime).toLocaleDateString() : '';
        const img = document.createElement('img');
        img.className = 'thumb';
        img.referrerPolicy = 'no-referrer';
        img.style.aspectRatio = `${w} / ${h}`;
        img.style.opacity = 0;
        img._sources = imageSources(meta, 1200);

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = date;

        card.appendChild(img);
        card.appendChild(metaEl);
        
        card.onclick = () => openLightbox(meta);

        // 注册到观察者
        imgObserver.observe(img);

        // 轮询插入列 (1 -> Col 1, 2 -> Col 2...)
        const targetColIndex = i % state.colCount;
        state.columns[targetColIndex].appendChild(card);

        // 卡片本身的入场动画 (transform)
        setTimeout(() => card.classList.add('reveal'), Math.min(i, 20) * 40); 
      });
    }

    // Lightbox
    const lb = $('lightbox');
    const lbImg = $('lbImg');
    function openLightbox(meta) {
        lb.className = 'lightbox open';
        lbImg.style.opacity = 0;
        loadImageWithFallback(lbImg, imageSources(meta, 2048));
    }
    lb.onclick = (e) => { 
      if (e.target !== lbImg) { lb.className = 'lightbox'; lbImg.src=''; }
    };

    init();
  })();
  </script>
</body>
</html>
