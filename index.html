<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Baoquan's Gallery</title>
  <style>
    /* === 基础样式 === */
    :root {
      --bg: #000000;
      --bg-translucent: rgba(20, 20, 20, 0.85);
      --fg: #f5f5f7;
      --card-bg: #1c1c1e;
      --accent: #0a84ff;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --bg-translucent: rgba(255,255,255,0.85); --fg: #1d1d1f; --card-bg: #f2f2f7; --accent: #0071e3; }
    }

    body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--fg); overflow-y: scroll; }
    .container { max-width: 1600px; margin: 0 auto; padding: 0 20px; }

    /* === 导航 === */
    header.nav { position: sticky; top: 0; z-index: 100; background: var(--bg-translucent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(125,125,125,0.15); }
    .nav-inner { height: 60px; display: flex; align-items: center; }
    .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }

    /* === 筛选器 === */
    .controls-area { position: sticky; top: 61px; z-index: 90; padding: 16px 0; background: var(--bg); }
    .controls-inner { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .chip { padding: 6px 16px; border-radius: 20px; font-size: 14px; background: var(--card-bg); color: #888; transition: 0.2s; cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--fg); color: var(--bg); }
    .search-input { margin-left: auto; background: var(--card-bg); border: none; border-radius: 8px; padding: 6px 12px; color: var(--fg); outline: none; }

    /* === 核心：JS 驱动的瀑布流布局 === */
    .grid { 
      display: flex; 
      align-items: flex-start; /* 关键：顶部对齐 */
      gap: 20px; 
      padding-bottom: 100px;
    }
    
    /* 每一列是一个垂直栈 */
    .grid-col {
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      min-width: 0; /* 防止 Flex 子项溢出 */
    }

    /* 卡片样式 */
    .card {
      position: relative; border-radius: 12px; overflow: hidden; background: var(--card-bg);
      transform: translateY(20px); opacity: 0; transition: transform 0.5s ease, opacity 0.5s ease;
      cursor: zoom-in;
    }
    .card.reveal { transform: translateY(0); opacity: 1; }
    .thumb { display: block; width: 100%; height: auto; object-fit: cover; }
    .meta { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 10px 10px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); color: #fff; font-size: 12px; opacity: 0; transition: 0.3s; pointer-events: none; }
    .card:hover .meta { opacity: 1; }

    /* Lightbox */
    .lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .lightbox.open { display: flex; }
    .lb-img { max-width: 95vw; max-height: 95vh; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    
    .loading { text-align: center; padding: 40px; color: #888; display: none; }
  </style>
</head>
<body>

  <header class="nav">
    <div class="nav-inner container">
      <div class="brand"><div class="brand-dot"></div><span>Gallery</span></div>
    </div>
  </header>

  <div class="container">
    <div class="controls-area">
      <div class="controls-inner">
        <div id="albums" style="display:flex; gap:10px"></div>
        <input id="searchInput" class="search-input" type="text" placeholder="Search...">
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="msg" class="loading">Loading...</div>
  </div>

  <div id="lightbox" class="lightbox">
    <img id="lbImg" class="lb-img">
  </div>

  <script>
  (function(){
    const CONFIG = {
      GOOGLE_CLIENT_ID: "55479337747-mtssp3ne22ut8chvecuuj5ljrjqj3mh7.apps.googleusercontent.com",
      ROOT_FOLDER_NAME: "Photo for Gallery",
      ROOT_FOLDER_ID: "1yj80gvI38UaaIy7HRCZbYJ6sLUS-a9Tw",
      API_KEY: "AIzaSyDzWCVEye-Rj3wCBdRIi9YAHq5i7UwHN5g",
    };

    let state = {
      albums: [],
      currentAlbum: null,
      loading: false,
      columns: [], // 存储列的 DOM 引用
      colCount: 0
    };

    const $ = id => document.getElementById(id);

    // === 核心逻辑：创建列 ===
    function setupGrid() {
      const grid = $('grid');
      const w = window.innerWidth;
      
      // 根据屏幕宽度决定列数
      let newColCount = 1;
      if (w >= 600) newColCount = 2;
      if (w >= 900) newColCount = 3;
      if (w >= 1400) newColCount = 4;
      if (w >= 1800) newColCount = 5;

      // 如果列数没变，就不重置
      if (newColCount === state.colCount && grid.children.length > 0) return;

      state.colCount = newColCount;
      state.columns = [];
      grid.innerHTML = '';

      // 创建 N 个列容器
      for (let i = 0; i < newColCount; i++) {
        const col = document.createElement('div');
        col.className = 'grid-col';
        grid.appendChild(col);
        state.columns.push(col);
      }
    }

    // === Drive API ===
    async function driveFetch(endpoint, params={}) {
      const url = new URL(`https://www.googleapis.com/drive/v3/${endpoint}`);
      params.key = CONFIG.API_KEY;
      params.supportsAllDrives = 'true';
      params.includeItemsFromAllDrives = 'true';
      Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
      const res = await fetch(url);
      return res.json();
    }

    async function init() {
      setupGrid();
      window.addEventListener('resize', () => {
        // 简单处理：窗口大小剧烈变化时刷新页面重新布局，或者复杂的重排逻辑
        // 这里为了体验，仅当从手机变电脑时可能需要刷新。
        // 为保证响应式，我们可以在 resize 时重新 setupGrid 并重新 render 现有 photos。
        // 简化版：暂不自动重排已加载图片，只调整新加载的。
        // 完美版建议：setupGrid() -> 清空 -> 重新把 state.allPhotos 塞进去。
      });

      try {
        const q = `'${CONFIG.ROOT_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
        const data = await driveFetch('files', { q, orderBy: 'name_natural' });
        state.albums = data.files.map(f => ({ id: f.id, name: f.name }));
        renderTabs();
        selectAlbum('__all__');
      } catch(e) { console.error(e); }
    }

    function renderTabs() {
      const box = $('albums');
      box.innerHTML = '';
      const mk = (id, txt) => {
        const b = document.createElement('div');
        b.className = 'chip';
        b.textContent = txt;
        b.onclick = () => selectAlbum(id);
        b.dataset.id = id;
        box.appendChild(b);
      };
      mk('__all__', '全部');
      state.albums.forEach(a => mk(a.id, a.name));
    }

    async function selectAlbum(id) {
      if (state.loading) return;
      state.loading = true;
      state.currentAlbum = id;
      
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));
      
      // 切换相册时，必须清空所有列
      setupGrid(); // 强制重置列
      state.columns.forEach(c => c.innerHTML = ''); 
      
      $('msg').style.display = 'block';
      $('msg').textContent = 'Loading...';

      try {
        let files = [];
        if (id === '__all__') {
            const tasks = [fetchPhotos(CONFIG.ROOT_FOLDER_ID, 40)];
            state.albums.forEach(a => tasks.push(fetchPhotos(a.id, 40)));
            const res = await Promise.all(tasks);
            const all = res.flat();
            // 去重
            const seen = new Set();
            files = all.filter(f => !seen.has(f.id) && seen.add(f.id));
        } else {
            files = await fetchPhotos(id, 100);
        }
        
        files.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime));
        renderPhotos(files);

      } catch(e) { console.error(e); }
      finally { state.loading = false; $('msg').style.display = 'none'; }
    }

    async function fetchPhotos(pid, size) {
      const q = `'${pid}' in parents and mimeType contains 'image/' and trashed = false`;
      const res = await driveFetch('files', { 
        q, pageSize: size, fields: 'files(id, thumbnailLink, createdTime, imageMediaMetadata)', orderBy: 'createdTime desc' 
      });
      return res.files || [];
    }

    // === 核心渲染：寻找最短列插入 ===
    function renderPhotos(files) {
      if(!files.length) { $('msg').textContent = 'No Photos'; $('msg').style.display='block'; return; }
      
      files.forEach((meta, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // 计算宽高比，防止图片加载前布局塌陷
        const w = meta.imageMediaMetadata?.width || 1;
        const h = meta.imageMediaMetadata?.height || 1;
        const aspectRatio = h / w; // 高宽比
        
        const date = meta.createdTime ? new Date(meta.createdTime).toLocaleDateString() : '';

        // 缩略图优化：列表页用 s500
        const src = meta.thumbnailLink ? meta.thumbnailLink.replace(/=s\d+(\-c)?/, '=s500') : '';

        card.innerHTML = `
           <img class="thumb" src="${src}" loading="lazy" style="aspect-ratio: ${1/aspectRatio}" />
           <div class="meta">${date}</div>
        `;
        card.onclick = () => openLightbox(meta);

        // --- 瀑布流算法 ---
        // 找到当前高度最小的那一列
        // 注意：因为图片是异步加载的，offsetHeight 此时可能不准。
        // 但我们利用了 style="aspect-ratio"，浏览器能预知高度，所以大致是准的。
        // 或者简单的轮询策略 (i % colCount) 也能保证水平填满。
        
        // 策略A: 简单轮询 (Index % N)。保证水平方向一定是满的，最符合你想要“铺满”的需求。
        // 策略B: 找最短列。Masonry 标准做法。

        // 这里用策略 B (Find Shortest) 会更自然，但如果图片没加载出来高度为0，就会全堆在第一列。
        // 既然我们有 aspectRatio，我们可以维护一个虚拟高度数组。
        
        // 简单起见，且为了修复你的“后面不行了”的问题，直接用【策略A：轮询插入】最稳。
        // 它强制：第1张->第1列，第2张->第2列，第3张->第3列，第4张->第4列... 
        
        const targetColIndex = i % state.colCount;
        state.columns[targetColIndex].appendChild(card);

        // 动画
        setTimeout(() => card.classList.add('reveal'), i * 30); 
      });
    }

    // Lightbox
    const lb = $('lightbox');
    const lbImg = $('lbImg');
    function openLightbox(meta) {
        lb.className = 'lightbox open';
        let src = `https://drive.google.com/uc?export=view&id=${meta.id}`;
        if(meta.thumbnailLink) src = meta.thumbnailLink.replace(/=s\d+(\-c)?/, '=s2048');
        lbImg.src = src;
    }
    lb.onclick = () => { lb.className = 'lightbox'; lbImg.src=''; };

    init();
  })();
  </script>
</body>
</html>
