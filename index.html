<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Baoquan's Gallery</title>
  <meta name="description" content="Baoquan Cao的摄影作品集" />
  <meta name="color-scheme" content="light dark" />
  <style>
    /* === Apple Design System Variables === */
    :root {
      --bg: #ffffff;
      --bg-translucent: rgba(255, 255, 255, 0.8);
      --fg: #1d1d1f;
      --muted: #86868b;
      --card-bg: #f5f5f7;
      --accent: #0071e3;
      --border: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --radius-md: 18px;
      --radius-lg: 24px;
      --ease-spring: cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-translucent: rgba(28, 28, 30, 0.8);
        --fg: #f5f5f7;
        --muted: #86868b;
        --card-bg: #1c1c1e;
        --accent: #2997ff;
        --border: rgba(255, 255, 255, 0.12);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
    }

    /* === Reset & Base === */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }
    button { font: inherit; color: inherit; border: none; background: none; padding: 0; cursor: pointer; outline: none; }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; width: 100%; }

    /* === Navigation === */
    header.nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-translucent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner { height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px rgba(0,113,227,0.15); }

    /* === Controls (Chips & Search) === */
    .controls-area { 
      position: sticky; top: 61px; z-index: 90; padding: 12px 0; 
      background: var(--bg); transition: transform 0.3s;
    }
    .controls-inner { 
      display: flex; gap: 12px; align-items: center; overflow-x: auto; 
      padding-bottom: 4px; scrollbar-width: none; 
    }
    .controls-inner::-webkit-scrollbar { display: none; }
    
    .chip {
      white-space: nowrap; padding: 8px 16px; border-radius: 999px; 
      font-size: 14px; font-weight: 500; color: var(--muted);
      background: var(--card-bg); transition: all 0.2s;
    }
    .chip.active { background: var(--fg); color: var(--bg); }
    
    .search-wrap { margin-left: auto; position: relative; }
    .search-input {
      background: var(--card-bg); border: none; border-radius: 8px;
      padding: 8px 12px; font-size: 14px; color: var(--fg); width: 140px;
      transition: width 0.3s; outline: none;
    }
    .search-input:focus { width: 200px; box-shadow: 0 0 0 2px var(--accent); }

    /* === Masonry Grid (Fixed) === */
    .grid { 
      column-width: 280px; 
      column-gap: 20px; 
      padding-bottom: 80px;
      /* 关键修复：让列从上到下填充，而不是尝试平衡高度 */
      column-fill: auto; 
    }
    
    .card {
      /* 关键修复：inline-block 在多列布局中更稳定，防止上方留白 */
      display: inline-block; 
      width: 100%; 
      break-inside: avoid; 
      margin-bottom: 20px; 
      position: relative;
      border-radius: var(--radius-md); 
      overflow: hidden;
      background: var(--card-bg);
      opacity: 0; /* 初始隐藏，等待 JS 显形 */
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s var(--ease-spring);
    }
    
    .card.reveal { opacity: 1; transform: translateY(0); }
    
    .thumb-wrap { position: relative; width: 100%; background: var(--card-bg); }
    .thumb { width: 100%; height: 100%; display: block; object-fit: cover; }

    /* === Lightbox === */
    .lightbox {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: none; justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.3s;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lb-img { max-width: 95vw; max-height: 90vh; border-radius: 4px; box-shadow: 0 20px 80px rgba(0,0,0,0.5); transform: scale(0.96); transition: transform 0.4s var(--ease-spring); }
    .lightbox.open .lb-img { transform: scale(1); }
    .lb-close { position: absolute; top: 20px; right: 20px; color: #fff; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }

    /* === States === */
    .loading-indicator { text-align: center; padding: 40px; color: var(--muted); display: none; }
    .loading-indicator.show { display: block; }
    .error-msg { text-align: center; padding: 60px 20px; color: var(--muted); display: none; }

  </style>
</head>
<body>

  <header class="nav">
    <div class="nav-inner container">
      <div class="brand"><div class="brand-dot"></div><span>Gallery</span></div>
    </div>
  </header>

  <div class="container">
    <div class="controls-area">
      <div class="controls-inner">
        <div id="albums" style="display:contents"></div>
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="text" placeholder="Search...">
        </div>
      </div>
    </div>

    <div id="gallery" class="grid"></div>
    
    <div id="loader" class="loading-indicator">Loading...</div>
    <div id="emptyMsg" class="error-msg">暂无照片</div>
  </div>

  <div id="lightbox" class="lightbox">
    <button id="lbClose" class="lb-close">✕</button>
    <img id="lbImg" class="lb-img" alt="">
  </div>

  <script>
  (function(){
    // === 配置 ===
    const CONFIG = {
      // 请保留你的 API Key
      GOOGLE_CLIENT_ID: "55479337747-mtssp3ne22ut8chvecuuj5ljrjqj3mh7.apps.googleusercontent.com",
      ROOT_FOLDER_NAME: "Photo for Gallery",
      ROOT_FOLDER_ID: "1yj80gvI38UaaIy7HRCZbYJ6sLUS-a9Tw",
      API_KEY: "AIzaSyDzWCVEye-Rj3wCBdRIi9YAHq5i7UwHN5g",
      PAGE_SIZE: 50 
    };

    // State
    let state = {
      rootId: CONFIG.ROOT_FOLDER_ID,
      albums: [],
      currentAlbum: null,
      photos: [],
      loading: false
    };

    const $ = id => document.getElementById(id);

    // === Drive API ===
    async function driveFetch(endpoint, params={}) {
      const url = new URL(`https://www.googleapis.com/drive/v3/${endpoint}`);
      params.key = CONFIG.API_KEY;
      params.supportsAllDrives = 'true';
      params.includeItemsFromAllDrives = 'true';
      Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
      
      const res = await fetch(url);
      if (!res.ok) throw new Error("API Error");
      return res.json();
    }

    // === Core Logic ===
    async function init() {
      try {
        // 1. 获取相册列表
        const q = `'${state.rootId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
        const data = await driveFetch('files', { q, orderBy: 'name_natural' });
        state.albums = data.files.map(f => ({ id: f.id, name: f.name }));
        
        renderTabs();
        selectAlbum('__all__'); // 默认加载全部
      } catch (e) {
        console.error(e);
        $('emptyMsg').textContent = "连接失败，请检查网络或配置";
        $('emptyMsg').style.display = 'block';
      }
    }

    function renderTabs() {
      const container = $('albums');
      container.innerHTML = '';
      
      const makeTab = (id, name) => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = name;
        btn.onclick = () => selectAlbum(id);
        btn.dataset.id = id;
        container.appendChild(btn);
      };
      
      makeTab('__all__', '全部');
      state.albums.forEach(a => makeTab(a.id, a.name));
    }

    async function selectAlbum(id) {
      if (state.loading) return;
      state.loading = true;
      state.currentAlbum = id;
      
      // UI Update
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));
      $('gallery').innerHTML = '';
      $('emptyMsg').style.display = 'none';
      $('loader').classList.add('show');

      try {
        let files = [];
        
        // 关键修复逻辑：如果是“全部”，则循环抓取所有已知相册的内容并合并
        // 这样比写一个超长 Query 更稳定
        if (id === '__all__') {
          // 创建一个任务队列：抓取 Root 下的图片 + 每个相册下的图片
          const tasks = [fetchPhotosInFolder(state.rootId)];
          state.albums.forEach(album => tasks.push(fetchPhotosInFolder(album.id)));
          
          const results = await Promise.all(tasks);
          // 合并并去重 (以防有重复)
          const allFiles = results.flat();
          const seen = new Set();
          files = allFiles.filter(f => {
            if (seen.has(f.id)) return false;
            seen.add(f.id);
            return true;
          });
          
          // 按时间排序
          files.sort((a, b) => new Date(b.createdTime) - new Date(a.createdTime));
          
        } else {
          // 单个相册很简单
          files = await fetchPhotosInFolder(id);
        }

        renderPhotos(files);
        
      } catch (e) {
        console.error(e);
      } finally {
        state.loading = false;
        $('loader').classList.remove('show');
      }
    }

    async function fetchPhotosInFolder(folderId) {
      const q = `'${folderId}' in parents and mimeType contains 'image/' and trashed = false`;
      const res = await driveFetch('files', {
        q,
        pageSize: 100, // 单次获取数量
        fields: 'files(id, name, createdTime, thumbnailLink, imageMediaMetadata)',
        orderBy: 'createdTime desc'
      });
      return res.files || [];
    }

    function renderPhotos(files) {
      if (!files.length) {
        $('emptyMsg').style.display = 'block';
        return;
      }
      
      const fragment = document.createDocumentFragment();
      files.forEach((meta, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${Math.min(i, 10) * 50}ms`; // 限制最大延迟防止排队太久

        // 计算宽高比，默认为 4:3
        const w = meta.imageMediaMetadata?.width || 4;
        const h = meta.imageMediaMetadata?.height || 3;
        const aspect = (h / w) * 100;

        // 关键：referrerpolicy="no-referrer" 防止 Google 403
        card.innerHTML = `
          <div class="thumb-wrap" style="padding-top:${aspect}%">
            <img class="thumb" 
                 loading="lazy" 
                 referrerpolicy="no-referrer"
                 style="position:absolute; top:0; left:0;"
                 alt="" />
          </div>
        `;

        // 绑定点击
        card.onclick = () => openLightbox(meta);

        // 图片加载逻辑
        const img = card.querySelector('img');
        if (meta.thumbnailLink) {
          // 列表页使用 s400 小图，加载更快
          img.src = meta.thumbnailLink.replace(/=s\d+(\-c)?/, '=s400');
          img.onload = () => card.classList.add('reveal');
          img.onerror = () => { /* 如果加载失败，保持占位，不显示红叉 */ };
        }

        fragment.appendChild(card);
      });
      $('gallery').appendChild(fragment);
    }

    // === Lightbox ===
    const $lb = $('lightbox');
    const $lbImg = $('lbImg');
    
    function openLightbox(meta) {
      $lb.classList.add('open');
      document.body.classList.add('modal-open');
      // 大图逻辑
      let src = `https://drive.google.com/uc?export=view&id=${meta.id}`;
      if (meta.thumbnailLink) {
        // 优先尝试超大缩略图 (s2048) 速度快
        src = meta.thumbnailLink.replace(/=s\d+(\-c)?/, '=s2048');
      }
      $lbImg.src = src;
    }
    
    $('lbClose').onclick = () => {
      $lb.classList.remove('open');
      document.body.classList.remove('modal-open');
      $lbImg.src = '';
    };

    // Filter Search
    $('searchInput').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        // 这里只是简单的 demo，实际应该根据 metadata 筛选。
        // 目前暂不支持前端即时筛选，建议直接保持为空即可，或者重新 fetch
      });
    });

    // Start
    init();

  })();
  </script>
</body>
</html>
