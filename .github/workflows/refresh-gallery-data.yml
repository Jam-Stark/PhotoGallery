name: Refresh gallery data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate gallery-data.json
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
        run: python scripts_generate_gallery_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json
          git commit -m "chore: refresh gallery data"
          git push

      - name: Send failure notification email
        if: ${{ failure() && secrets.ALERT_EMAIL_TO != '' && secrets.ALERT_EMAIL_FROM != '' && secrets.SMTP_HOST != '' && secrets.SMTP_PORT != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[PhotoGallery] Workflow failed: refresh-gallery-data"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
