name: Refresh gallery data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate gallery-data.json
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
        run: python scripts_generate_gallery_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json
          if [ -d photos ]; then
            git add photos
          fi

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "chore: refresh gallery data"
          git push
